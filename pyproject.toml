[project]
name = "siglip2-embed-service"
version = "0.1.1"
description = "A small HTTP embedding service for SigLIP2."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "numpy>=2,<3",
    "pillow>=11,<12",
    "python-multipart>=0.0.20,<1",
    "transformers==4.46.1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
cpu = ["onnxruntime==1.22.0"]
cuda = ["onnxruntime-gpu==1.22.0"]
intel = ["openvino==2025.4.1"]

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/siglip2_embed"]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cuda" },
    ],
    [
        { extra = "cuda" },
        { extra = "intel" },
    ],
    [
        { extra = "cpu" },
        { extra = "intel" },
    ],
]

[tool.pytest.ini_options]
testpaths = ["tests"]
