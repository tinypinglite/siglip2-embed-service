name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install locked CPU runtime dependencies
        run: uv sync --frozen --extra cpu --group dev

      - name: Build native image decoders
        run: |
          sudo apt-get update
          sudo apt-get install -y libturbojpeg0-dev libwebp-dev
          sh tools/build_webp_decoder.sh
          sh tools/build_jpeg_decoder.sh

      - name: Compile source, tests, and one-time export tools
        run: uv run --frozen python -m compileall -q src tests tools

      - name: Run tests
        run: uv run --frozen pytest -q

      - name: Build the CPU runtime stage
        run: docker build --target cpu-runtime --tag siglip2-embed-service:ci .
