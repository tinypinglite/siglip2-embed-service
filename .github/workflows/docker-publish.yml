name: Publish Docker Images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version_tag:
        description: Optional version tag, for example v1.0.0
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: siglip2-docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: tinyping/siglip2-embed-service
  MODEL_RELEASE_TAG: siglip2-base-patch16-224-v1

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve image tags
        id: tags
        env:
          VERSION_TAG: ${{ inputs.version_tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" != "tag" ] && [ -z "${{ inputs.version_tag }}" ]; then
            VERSION_TAG=""
          fi
          if [ -n "$VERSION_TAG" ] && ! printf '%s' "$VERSION_TAG" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'; then
            echo "::error::version tag contains unsupported Docker tag characters"
            exit 1
          fi
          {
            echo "cpu=${IMAGE_NAME}:cpu"
            echo "intel=${IMAGE_NAME}:intel"
            echo "cuda=${IMAGE_NAME}:cuda"
            if [ -n "$VERSION_TAG" ]; then
              echo "cpu_version=${IMAGE_NAME}:${VERSION_TAG}-cpu"
              echo "intel_version=${IMAGE_NAME}:${VERSION_TAG}-intel"
              echo "cuda_version=${IMAGE_NAME}:${VERSION_TAG}-cuda"
            else
              echo "cpu_version="
              echo "intel_version="
              echo "cuda_version="
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Download immutable ONNX model bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .model-release
          gh release download "${MODEL_RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern 'siglip2-base-patch16-224-v1-onnx-fp16.tar.zst' \
            --dir .model-release
          test -f .model-release/siglip2-base-patch16-224-v1-onnx-fp16.tar.zst

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: tinyping
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare ONNX model bundle
        run: |
          set -euo pipefail
          rm -rf model-bundles/active
          mkdir -p model-bundles/active
          tar --zstd -xf .model-release/siglip2-base-patch16-224-v1-onnx-fp16.tar.zst \
            -C model-bundles/active
          chmod -R a+rX model-bundles/active

      - name: Build and push multi-architecture CPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: cpu
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.tags.outputs.cpu }}
            ${{ steps.tags.outputs.cpu_version }}
          build-args: MODEL_BUNDLE=model-bundles/active
          cache-from: type=gha,scope=siglip2-cpu
          cache-to: type=gha,mode=max,scope=siglip2-cpu

      - name: Reclaim runner disk space before NVIDIA build
        run: |
          set -euo pipefail
          rm -rf model-bundles/active
          docker buildx prune --all --force
          docker system prune --all --force --volumes
          df -h

      - name: Build and push NVIDIA CUDA image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: cuda
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.tags.outputs.cuda }}
            ${{ steps.tags.outputs.cuda_version }}
          build-args: MODEL_BUNDLE=model-bundles/active
          cache-from: type=gha,scope=siglip2-cuda
          cache-to: type=gha,mode=max,scope=siglip2-cuda

      - name: Reclaim runner disk space before Intel build
        run: |
          set -euo pipefail
          rm -rf .model-release model-bundles/active
          docker buildx prune --all --force
          docker system prune --all --force --volumes
          df -h

      - name: Download immutable OpenVINO model bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .model-release
          gh release download "${MODEL_RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern 'siglip2-base-patch16-224-v1-openvino-fp16.tar.zst' \
            --dir .model-release
          test -f .model-release/siglip2-base-patch16-224-v1-openvino-fp16.tar.zst

      - name: Prepare OpenVINO model bundle
        run: |
          set -euo pipefail
          rm -rf model-bundles/active
          mkdir -p model-bundles/active
          tar --zstd -xf .model-release/siglip2-base-patch16-224-v1-openvino-fp16.tar.zst \
            -C model-bundles/active
          chmod -R a+rX model-bundles/active

      - name: Build and push Intel GPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: intel
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.tags.outputs.intel }}
            ${{ steps.tags.outputs.intel_version }}
          build-args: MODEL_BUNDLE=model-bundles/active
          cache-from: type=gha,scope=siglip2-intel
          cache-to: type=gha,mode=max,scope=siglip2-intel
